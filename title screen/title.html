<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delivery Duck</title>

    <link rel="stylesheet" href="title.css">

</head>


<body>


    <main class="title-screen">


        <!-- =========================================
             GAME TITLE
        ========================================== -->

        <div class="logo">

            <div class="logo-word delivery">

                <span>D</span>
                <span>E</span>
                <span>L</span>
                <span>I</span>
                <span>V</span>
                <span>E</span>
                <span>R</span>

                <span class="y-letter">

                    Y

                    <!-- Duck will sit here -->

                    <img
                        class="title-duck"
                        src="../ducky_3_spritesheet.png"
                        alt="Delivery Duck"
                    >

                </span>

            </div>


            <div class="logo-word duck">

                DUCK

            </div>

        </div>


        <!-- =========================================
             MENU
        ========================================== -->

        <div class="menu">

            <button id="playButton">
                PLAY
            </button>

            <button id="creditsButton">
                CREDITS
            </button>

        </div>


        <!-- =========================================
             VERSION
        ========================================== -->

        <div class="version">

            v0.1

        </div>


        <!-- =========================================
             CREDITS PANEL
        ========================================== -->

        <div
            id="creditsPanel"
            class="credits-panel hidden"
        >

            <div class="credits-box">

                <h2>CREDITS</h2>

                <p>
                    <strong>Delivery Duck</strong>
                </p>

                <p>
                    Duck character:
                    <br>
                    Ducky 3 by CazBee
                </p>

                <button id="closeCreditsButton">
                    CLOSE
                </button>

            </div>

        </div>


    </main>


    <script src="title.js"></script>

</body>

</html>
