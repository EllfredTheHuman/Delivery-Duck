<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delivery Duck</title>

    <link rel="stylesheet" href="title.css">

</head>


<body>

    <main class="title-screen">


        <!-- SKY -->

        <div class="sky">

            <div class="sun"></div>

            <div class="cloud cloud-one">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="cloud cloud-two">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="cloud cloud-three">
                <span></span>
                <span></span>
                <span></span>
            </div>


            <!-- HILLS -->

            <div class="hill hill-back"></div>

            <div class="hill hill-front"></div>

        </div>


        <!-- TITLE -->

        <div class="logo">

            <div class="delivery-word">

                <span>D</span>
                <span>E</span>
                <span>L</span>
                <span>I</span>
                <span>V</span>
                <span>E</span>
                <span>R</span>

                <span class="y-letter">

                    Y

                    <canvas
                        id="titleDuck"
                        width="32"
                        height="32"
                    ></canvas>

                </span>

            </div>


            <div class="duck-word">
                DUCK
            </div>

        </div>


        <!-- MENU -->

        <div class="menu">

            <button id="playButton">
                PLAY
            </button>

            <button id="creditsButton">
                CREDITS
            </button>

        </div>


        <!-- CREDITS -->

        <div
            id="creditsPanel"
            class="credits-panel hidden"
        >

            <div class="credits-box">

                <h2>CREDITS</h2>

                <p>
                    <strong>Delivery Duck</strong>
                </p>

                <p>
                    Duck character:
                    <br>
                    Ducky 3 by CazBee
                </p>

                <button id="closeCreditsButton">
                    CLOSE
                </button>

            </div>

        </div>


        <!-- VERSION -->

        <div class="version">
            v0.1
        </div>


    </main>


    <script src="title.js"></script>

</body>

</html>
